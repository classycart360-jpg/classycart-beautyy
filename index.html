<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClassyCart | Future of Beauty</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;300;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #d4af37;
            --bg: #050505;
            --card-glass: rgba(255, 255, 255, 0.03);
            --gold-glow: rgba(212, 175, 55, 0.2);
            --soft-border: rgba(255, 255, 255, 0.08);
        }

        body, html { 
            margin: 0; padding: 0; background: var(--bg); color: white; 
            font-family: 'Montserrat', sans-serif; overflow-x: hidden;
        }

        /* --- 1. CINEMATIC INTRO --- */
        #intro {
            position: fixed; inset: 0; background: black; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            animation: exit 0.8s ease forwards 3.5s;
        }
        .intro-logo {
            font-size: clamp(1.5rem, 8vw, 3rem); letter-spacing: 15px; font-weight: 800; opacity: 0;
            animation: logoReveal 2s ease-out forwards 0.5s;
        }
        @keyframes logoReveal {
            0% { opacity: 0; transform: scale(0.9); filter: blur(10px); }
            100% { opacity: 1; transform: scale(1); filter: blur(0); text-shadow: 0 0 20px var(--accent); }
        }
        @keyframes exit { to { opacity: 0; visibility: hidden; } }

        /* --- 2. CATEGORY HUB --- */
        #hub {
            min-height: 100vh; display: flex; flex-direction: column; justify-content: center; 
            align-items: center; opacity: 0; animation: fadeIn 1s forwards 4s;
            padding: 40px 20px;
        }
        .hub-title { font-weight: 100; letter-spacing: 8px; color: var(--accent); margin-bottom: 40px; text-align: center; }
        
        .cat-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); 
            gap: 15px; 
            width: 100%; 
            max-width: 1000px; 
        }
        
        /* Desktop specific grid override */
        @media (min-width: 768px) { .cat-grid { grid-template-columns: repeat(3, 1fr); gap: 30px; } }

        .cat-item {
            height: 250px; border-radius: 20px; overflow: hidden;
            position: relative; cursor: pointer; border: 1px solid var(--soft-border);
            transition: 0.4s;
        }
        @media (min-width: 768px) { .cat-item { height: 350px; } }

        .cat-item img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.6); }
        .cat-item:hover { transform: translateY(-5px); border-color: var(--accent); box-shadow: 0 10px 30px var(--gold-glow); }
        .cat-label {
            position: absolute; bottom: 15px; left: 0; width: 100%; text-align: center;
            font-weight: 600; letter-spacing: 3px; text-transform: uppercase; font-size: 0.7rem;
        }

        /* --- 3. PRODUCT SHOWCASE --- */
        #product-view { display: none; position: fixed; inset: 0; background: #000; z-index: 500; overflow-y: auto; }
        
        .drop-container { 
            width: 100%; min-height: 100vh; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; position: relative; padding: 60px 20px; box-sizing: border-box;
        }

        /* Responsive Layout for Desktop */
        @media (min-width: 1024px) {
            .drop-container { flex-direction: row; padding: 0; }
        }

        .p-img-box { opacity: 0; transform: translateY(-100px); margin-bottom: 20px; z-index: 2; }
        .p-img-box.active {
            animation: dropStop 1s cubic-bezier(0.17, 0.89, 0.32, 1.27) forwards, float 4s ease-in-out infinite 1s;
        }
        .p-img-box img { max-height: 35vh; width: auto; filter: drop-shadow(0 15px 40px rgba(0,0,0,0.8)); }
        
        @media (min-width: 1024px) {
            .p-img-box img { max-height: 500px; }
            .p-img-box { position: absolute; transform: translateY(-120vh); }
        }

        .p-info {
            width: 100%; max-width: 340px; padding: 25px; border-radius: 20px;
            background: var(--card-glass); backdrop-filter: blur(15px);
            border: 1px solid var(--soft-border); opacity: 0; 
            transition: 0.8s ease 0.8s; margin-bottom: 15px;
        }
        
        @media (min-width: 1024px) {
            .p-info { position: absolute; margin-bottom: 0; }
            .info-left { left: 8%; transform: translateX(-100px); }
            .info-right { right: 8%; transform: translateX(100px); }
        }

        #product-view.reveal .p-info { opacity: 1; transform: translateX(0); }

        .p-name { font-size: 1.1rem; font-weight: 800; margin: 0; text-transform: uppercase; }
        .p-price { font-size: 2.2rem; font-weight: 100; color: var(--accent); margin: 10px 0; }
        
        .buy-btn {
            display: block; width: 100%; padding: 15px; background: white; color: black;
            text-align: center; text-decoration: none; font-weight: 800; border-radius: 10px;
            transition: 0.3s; text-transform: uppercase; font-size: 0.9rem;
        }
        .buy-btn:hover { background: var(--accent); }

        .back-nav { position: absolute; top: 20px; left: 20px; cursor: pointer; color: var(--accent); font-size: 0.8rem; z-index: 1000; }
        
        .cycle-nav { 
            position: fixed; bottom: 20px; display: flex; gap: 20px; z-index: 1000; left: 50%; transform: translateX(-50%);
        }
        .nav-btn { background: rgba(0,0,0,0.6); border: 1px solid var(--accent); color: var(--accent); padding: 8px 20px; cursor: pointer; border-radius: 20px; font-size: 0.7rem; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes dropStop {
            0% { transform: translateY(-50vh); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    </style>
</head>

    let curCat = '';
    let curIdx = 0;

    function launch(cat) {
        curCat = cat; curIdx = 0;
        document.getElementById('hub').style.display = 'none';
        document.getElementById('product-view').style.display = 'block';
        render();
    }

    function render() {
        const p = db[curCat][curIdx];
        const display = document.getElementById('display-content');
        
        // Reset view state
        document.getElementById('product-view').classList.remove('reveal');
        
        display.innerHTML = `
            <div class="p-img-box" id="p-img"><img src="${p.img}"></div>
            <div class="p-info info-left">
                <span style="color:#d4af37; letter-spacing:2px; font-size:0.6rem;">CLASSYCART ELITE</span>
                <h1 class="p-name">${p.name}</h1>
            </div>
            <div class="p-info info-right">
                <div class="p-price">${p.price}</div>
                <a href="${p.link}" target="_blank" class="buy-btn">BUY ON AMAZON</a>
            </div>
        `;
        
        // Use a slight timeout to ensure animation triggers after DOM update
        setTimeout(() => {
            document.getElementById('p-img').classList.add('active');
            document.getElementById('product-view').classList.add('reveal');
        }, 50);
    }

    function changeProd(dir) {
        curIdx += dir;
        if (curIdx < 0) curIdx = db[curCat].length - 1;
        if (curIdx >= db[curCat].length) curIdx = 0;
        render();
    }

    function closeView() {
        document.getElementById('product-view').style.display = 'none';
        document.getElementById('hub').style.display = 'flex';
    }
</script>
