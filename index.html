<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClassyCart | Future of Beauty</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;300;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #d4af37;
            --bg: #050505;
            --card-glass: rgba(255, 255, 255, 0.03);
            --gold-glow: rgba(212, 175, 55, 0.2);
            --soft-border: rgba(255, 255, 255, 0.08);
        }

        body, html { 
            margin: 0; padding: 0; background: var(--bg); color: white; 
            font-family: 'Montserrat', sans-serif; overflow-x: hidden;
        }

        /* --- 1. CINEMATIC INTRO --- */
        #intro {
            position: fixed; inset: 0; background: black; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            animation: exit 0.8s ease forwards 4s;
        }
        .intro-logo {
            font-size: 3rem; letter-spacing: 20px; font-weight: 800; opacity: 0;
            animation: logoReveal 2.5s ease-out forwards 1s;
        }
        @keyframes logoReveal {
            0% { opacity: 0; transform: scale(0.9); filter: blur(10px); }
            50% { opacity: 1; filter: blur(0); text-shadow: 0 0 25px var(--accent); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes exit { to { opacity: 0; visibility: hidden; } }

        /* --- 2. CATEGORY HUB --- */
        #hub {
            min-height: 100vh; display: flex; flex-direction: column; justify-content: center; 
            align-items: center; opacity: 0; animation: fadeIn 1s forwards 4.5s;
            padding: 50px 0;
        }
        .hub-title { font-weight: 100; letter-spacing: 12px; color: var(--accent); margin-bottom: 60px; text-transform: uppercase; }
        .cat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; max-width: 1000px; padding: 20px; }
        
        .cat-item {
            width: 100%; height: 350px; border-radius: 25px; overflow: hidden;
            position: relative; cursor: pointer; border: 1px solid var(--soft-border);
            transition: 0.5s cubic-bezier(0.2, 1, 0.3, 1);
        }
        .cat-item img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.6); transition: 0.5s; }
        .cat-item:hover { transform: translateY(-10px); border-color: var(--accent); box-shadow: 0 15px 40px var(--gold-glow); }
        .cat-item:hover img { filter: brightness(0.9); transform: scale(1.05); }
        .cat-label {
            position: absolute; bottom: 25px; left: 0; width: 100%; text-align: center;
            font-weight: 600; letter-spacing: 5px; text-transform: uppercase; font-size: 0.9rem;
        }

        /* --- 3. PRODUCT SHOWCASE --- */
        #product-view { display: none; position: fixed; inset: 0; background: radial-gradient(circle at center, #111, #000); z-index: 500; }
        .drop-container { width: 100%; height: 100vh; display: flex; justify-content: center; align-items: center; position: relative; }

        .p-img-box { position: absolute; transform: translateY(-120vh); opacity: 0; z-index: 2; }
        .p-img-box.active {
            animation: dropStop 1.2s cubic-bezier(0.1, 0.9, 0.2, 1) forwards, float 4s ease-in-out infinite 1.2s;
        }
        .p-img-box img { max-height: 480px; width: auto; filter: drop-shadow(0 20px 60px rgba(0,0,0,0.8)); border-radius: 15px; }

        .p-info {
            position: absolute; width: 340px; padding: 35px; border-radius: 25px;
            background: var(--card-glass); backdrop-filter: blur(20px);
            border: 1px solid var(--soft-border); opacity: 0; transition: 1s ease 1s;
        }
        .info-left { left: 5%; transform: translateX(-100px); }
        .info-right { right: 5%; transform: translateX(100px); border-bottom: 2px solid var(--accent); }

        #product-view.reveal .p-info { opacity: 1; transform: translateX(0); }

        .p-name { font-size: 1.4rem; font-weight: 800; margin: 0; text-transform: uppercase; line-height: 1.2; letter-spacing: -0.5px; }
        .p-price { font-size: 3rem; font-weight: 100; color: var(--accent); margin: 15px 0; }
        .buy-btn {
            display: block; width: 100%; padding: 18px; background: white; color: black;
            text-align: center; text-decoration: none; font-weight: 800; border-radius: 12px;
            transition: 0.3s; text-transform: uppercase; letter-spacing: 2px;
        }
        .buy-btn:hover { background: var(--accent); transform: scale(1.03); }

        .back-nav { position: absolute; top: 40px; left: 40px; cursor: pointer; color: var(--accent); font-weight: 600; z-index: 1000; letter-spacing: 2px; }
        .cycle-nav { position: absolute; bottom: 40px; display: flex; gap: 30px; z-index: 1000; }
        .nav-btn { background: none; border: 1px solid var(--accent); color: var(--accent); padding: 10px 25px; cursor: pointer; transition: 0.3s; border-radius: 50px; }
        .nav-btn:hover { background: var(--accent); color: black; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes dropStop {
            0% { transform: translateY(-120vh); opacity: 0; }
            75% { transform: translateY(0); opacity: 1; }
            90% { transform: translateY(-10px); }
            100% { transform: translateY(0); opacity: 1; }
        }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

        @media (max-width: 900px) {
            .cat-grid { grid-template-columns: 1fr 1fr; }
            .info-left, .info-right { width: 80%; left: 10%; right: 10%; position: relative; transform: none; margin-bottom: 20px; }
            .drop-container { flex-direction: column; height: auto; padding-top: 100px; }
            .p-img-box { position: relative; transform: none; margin: 40px 0; }
            .p-img-box img { max-height: 300px; }
        }
    </style>
</head>

    let curCat = '';
    let curIdx = 0;

    function launch(cat) {
        curCat = cat; curIdx = 0;
        document.getElementById('hub').style.display = 'none';
        document.getElementById('product-view').style.display = 'block';
        render();
    }

    function render() {
        const p = db[curCat][curIdx];
        const display = document.getElementById('display-content');
        display.innerHTML = `
            <div class="p-img-box" id="p-img"><img src="${p.img}"></div>
            <div class="p-info info-left">
                <span style="color:#d4af37; letter-spacing:3px; font-size:0.7rem;">CLASSYCART SELECTION</span>
                <h1 class="p-name">${p.name}</h1>
            </div>
            <div class="p-info info-right">
                <div class="p-price">${p.price}</div>
                <a href="${p.link}" target="_blank" class="buy-btn">BUY ON AMAZON</a>
            </div>
        `;
        setTimeout(() => {
            document.getElementById('p-img').classList.add('active');
            document.getElementById('product-view').classList.add('reveal');
        }, 100);
    }

    function changeProd(dir) {
        curIdx += dir;
        if (curIdx < 0) curIdx = db[curCat].length - 1;
        if (curIdx >= db[curCat].length) curIdx = 0;
        document.getElementById('product-view').classList.remove('reveal');
        render();
    }

    function closeView() {
        document.getElementById('product-view').style.display = 'none';
        document.getElementById('hub').style.display = 'flex';
    }
</script>
